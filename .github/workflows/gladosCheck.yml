name: GLaDOS Check-in

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（backup = 静默补偿，只有真正签到成功才推送）'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - backup
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'CODEMAP.md'
      - 'imgs/**'
  schedule:
    # 两条 cron 分开写：只有分开，github.event.schedule 才能区分主跑与补偿跑
    # timezone 让 cron 按北京时间解析（09:18 主跑 / 12:18 补偿）；等价 UTC 为 01:18 / 04:18
    - cron: '18 9 * * *'
      timezone: 'Asia/Shanghai'
    - cron: '18 12 * * *'
      timezone: 'Asia/Shanghai'

# 定时与手动触发可能重叠：同一时间只保留一个运行，避免重复签到与重复推送
concurrency:
  group: glados-checkin
  cancel-in-progress: false

jobs:
  build:
    name: glados checkin
    runs-on: ubuntu-latest

    # 脚本自带 5 分钟运行预算；这里再兜底，避免异常情况卡住
    timeout-minutes: 15

    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        # workflow_dispatch 手动指定优先；12:18 的定时任务自动降级为补偿跑
        CHECKIN_MODE: ${{ inputs.mode || (github.event.schedule == '18 12 * * *' && 'backup' || 'normal') }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
