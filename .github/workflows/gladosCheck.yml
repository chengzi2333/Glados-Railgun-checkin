name: auto check

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式（backup = 静默补偿，只有真正签到成功才推送）'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - backup
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'imgs/**'
  schedule:
    # GitHub 的 cron 一律按 UTC 解析：01:07 UTC = 北京时间 09:07
    # 错开整点（00 分）是因为整点是 GitHub 调度最拥挤的时段，容易被延迟
    - cron: '7 1 * * *'
    # 10:30 补偿跑：只有当天确实没签上、这次补签成功时才推送
    - cron: '30 2 * * *'

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 执行 签到脚本
    - name: Running checkin
      run: |
        python checkin.py
      env:
        PUSHDEER_SENDKEY: ${{ secrets.PUSHDEER_SENDKEY }}
        SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        # workflow_dispatch 手动指定优先；定时任务按 cron 判断是否是 10:30 的补偿跑
        CHECKIN_MODE: ${{ inputs.mode || (github.event.schedule == '30 2 * * *' && 'backup' || 'normal') }}

    - name: Keep alive
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        retain_days: 7
        keep_minimum_runs: 7
        delete_run_by_conclusion_pattern: success
